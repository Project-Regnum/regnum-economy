# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: regnum-economy
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          path: regnum-economy
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: set up the pinned Nations compiler and Minecraft runtime
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          # setup-java encodes the JEP 322 patch and build as SemVer metadata.
          java-version: '21.0.12+1.1'
          distribution: temurin
      - name: set up JDK 25 for Gradle and Loom
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - name: read Nations source lock
        id: nations
        run: sed -n 's/^nations_api_commit=/commit=/p' gradle.properties >> "$GITHUB_OUTPUT"
      - name: checkout pinned Nations source
        uses: actions/checkout@v6
        with:
          repository: Project-Regnum/regnum-nations
          ref: ${{ steps.nations.outputs.commit }}
          path: regnum-nations
      - name: provision Nations dependency
        working-directory: regnum-nations
        run: bash ./gradlew remapJar --no-daemon --console=plain
      - name: verify provisioned Nations content
        run: bash ./gradlew verifyNationsDependency --no-daemon --console=plain
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew test build --no-daemon --console=plain
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: regnum-economy/build/libs/
